name: Check official doctoral admissions pages

on:
  schedule:
    # UTC 00:17/06:17/12:17/18:17 = Beijing 08:17/14:17/20:17/02:17.
    # GitHub scheduled workflows may run later than the scheduled minute.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/schools.json'
      - 'scripts/**'
      - 'site/**'
      - 'requirements.txt'
      - '.github/workflows/monitor.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: education-phd-tracker-pages
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check official sources (unverified changes only)
        run: python scripts/check_sources.py
      - name: Rebuild site from verified school data
        run: python scripts/build_site.py
      - name: Commit monitoring logs and generated website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_state.json docs/data/monitor.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh official admissions source checks'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
